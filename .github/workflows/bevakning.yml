name: Bevakning – nya plagg i ropet

on:
  schedule:
    # 06:17 UTC = 07:17 svensk vintertid, 08:17 sommartid. GitHub kan starta några minuter sent.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bevakning
  cancel-in-progress: false

jobs:
  bevaka:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Installera Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sök efter nya plagg
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node bevakning/kor.mjs

      - name: Spara fynd och historik
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          if [ -f config.json ]; then git add config.json; fi
          git commit -m "Bevakning: dagens fynd" || echo "Inget nytt att spara"
          git push
